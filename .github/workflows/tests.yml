name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt httpx
      - name: Syntax
        run: python -m compileall -q app.py tracker.py vision.py spotlight.py server.py make_markers.py grok_vision.py hybrid_memory.py hybrid.py
      - name: Camera-free automated tests
        run: python -m unittest discover -s tests -v
